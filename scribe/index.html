<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1316">
<title>Scribe</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<header>
  <h1 id="title">Scribe</h1>
  <span id="chip" class="chip">Online</span>
</header>

<main>
  <section id="v-rec">
    <textarea id="txt" placeholder="Tap the microphone and start speaking. You can also type or fix words here." aria-label="Transcript" spellcheck="true"></textarea>
    <div id="live" aria-live="polite"></div>
    <div class="meta"><span id="wc">0 words</span><span id="timer">00:00</span></div>
    <p id="msg" role="status"></p>
    <div class="tools">
      <button id="copy" class="tool">Copy</button>
      <button id="share" class="tool">Share</button>
      <button id="clear" class="tool">Clear</button>
      <button id="new" class="tool">New</button>
    </div>
    <div class="micwrap">
      <button id="mic" class="mic" aria-label="Start listening">
        <svg class="i-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </div>
  </section>

  <section id="v-lib" hidden>
    <input id="lq" type="search" placeholder="Search transcripts" aria-label="Search transcripts">
    <div id="llist" class="list"></div>
  </section>

  <section id="v-set" hidden></section>
</main>

<nav>
  <button data-view="rec" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Dictate</button>
  <button data-view="lib"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Library</button>
  <button data-view="set"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
</nav>

<script type="module" src="/src/main.js"></script>
</body>
</html>
